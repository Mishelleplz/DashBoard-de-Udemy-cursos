[project]
name = "udemy-etl"
version = "1.0.0"
description = "ETL que limpia el export de Udemy y genera courses.json"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["udemy_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
